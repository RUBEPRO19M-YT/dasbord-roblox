<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control Roblox - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
    <style>
        /* Estilos adicionales */
        body {
            font-family: 'Arial', sans-serif;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <!-- Pantalla de login -->
    <div id="loginScreen" class="fixed inset-0 bg-white flex flex-col justify-center items-center">
        <div class="bg-gray-200 p-8 rounded shadow-md w-80">
            <h2 class="text-xl font-bold mb-4 text-center">Iniciar Sesión</h2>
            <input id="loginUser" type="text" placeholder="Usuario de Discord" class="w-full mb-3 p-2 border rounded" />
            <input id="loginPass" type="password" placeholder="Contraseña" class="w-full mb-4 p-2 border rounded" />
            <button onclick="checkLogin()" class="w-full bg-blue-600 text-white px-4 py-2 rounded">Entrar</button>
            <p id="loginError" class="text-red-600 mt-2 hidden text-sm text-center">Credenciales incorrectas</p>
        </div>
    </div>

    <!-- Dashboard (oculto por defecto) -->
    <div id="mainContent" class="flex h-screen hidden">
        <div class="w-full p-4">
            <h1 class="text-2xl font-bold">Bienvenido al Panel de Control</h1>
            <p>Este es tu panel de administración.</p>
        </div>
    </div>

    <script>
        async function checkLogin() {
            const user = document.getElementById("loginUser").value.trim();
            const pass = document.getElementById("loginPass").value.trim();
            const errorMsg = document.getElementById("loginError");

            if (user === "" || pass === "") {
                errorMsg.textContent = "Por favor, rellena ambos campos.";
                errorMsg.classList.remove("hidden");
                return;
            }

            try {
                // Conecta a la API de SheetDB
                const response = await fetch("https://sheetdb.io/api/v1/o2lxnf9sqn6ro");
                const data = await response.json();

                // Buscar si el usuario y la contraseña coinciden
                const userExists = data.find(entry => entry.discord_username === user && entry.password === pass);

                if (userExists) {
                    // Si las credenciales son correctas, mostrar el contenido del dashboard
                    document.getElementById("loginScreen").classList.add("hidden");
                    document.getElementById("mainContent").classList.remove("hidden");
                } else {
                    // Si no, mostrar error
                    errorMsg.classList.remove("hidden");
                }
            } catch (error) {
                console.error("Error al verificar las credenciales:", error);
                errorMsg.textContent = "Hubo un error al verificar las credenciales. Intenta de nuevo.";
                errorMsg.classList.remove("hidden");
            }
        }
    </script>
</body>
</html>
