<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Usuario/Staff</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@2.8.2" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <style>
        .hidden {
            display: none;
        }

        .tab {
            display: none;
        }

            .tab.active {
                display: block;
            }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Login Form -->
    <div id="loginForm" class="flex justify-center items-center h-screen">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h2 class="text-2xl font-semibold mb-4">Iniciar sesión</h2>
            <form id="login" onsubmit="return login(event)">
                <div class="mb-4">
                    <label for="username" class="block text-gray-700">Nombre de usuario</label>
                    <input type="text" id="username" name="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-gray-700">Contraseña</label>
                    <input type="password" id="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg">Iniciar sesión</button>
            </form>
        </div>
    </div>

    <!-- Panel -->
    <div id="panel" class="hidden flex h-screen">
        <!-- Sidebar -->
        <div class="bg-blue-800 w-64 p-6 text-white flex flex-col">
            <h2 class="text-2xl font-semibold mb-6" id="panelTitle">Menú</h2>
            <nav class="flex flex-col gap-4">
                <button onclick="showTab('perfilTab')" class="hover:bg-blue-700 py-2 px-4 rounded-lg">Perfil</button>
                <button onclick="showTab('incidenciasTab')" class="hover:bg-blue-700 py-2 px-4 rounded-lg">Moderación</button>
                <button onclick="showTab('multasTab')" class="hover:bg-blue-700 py-2 px-4 rounded-lg">Multas</button>
                <button id="addUserBtn" class="hover:bg-blue-700 py-2 px-4 rounded-lg hidden" onclick="showTab('addUserForm')">Agregar Usuario</button>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-6 ml-64">
            <div id="perfilTab" class="tab active">
                <h2 class="text-2xl font-semibold mb-4">Mi Perfil</h2>
                <div class="bg-white shadow-lg rounded-lg p-6">
                    <h3 class="text-lg font-medium">Nombre: <span id="userName"></span></h3>
                    <h3 class="text-lg font-medium">Rol: <span id="userRole"></span></h3>
                </div>
            </div>

            <div id="incidenciasTab" class="tab">
                <h2 class="text-2xl font-semibold mb-4">Moderación</h2>
                <div class="bg-white shadow-lg rounded-lg p-6">
                    <ul id="incidenciasList"></ul>
                </div>
            </div>

            <div id="multasTab" class="tab">
                <h2 class="text-2xl font-semibold mb-4">Multas</h2>
                <div class="bg-white shadow-lg rounded-lg p-6">
                    <ul id="multasList"></ul>
                </div>
            </div>

            <div id="addUserForm" class="tab hidden">
                <h2 class="text-2xl font-semibold mb-4">Agregar Usuario</h2>
                <form id="addUser" onsubmit="return addUser(event)">
                    <input id="newUsername" placeholder="Nombre de usuario" required class="block mb-4 w-full px-4 py-2 border border-gray-300 rounded-lg" />
                    <input type="password" id="newPassword" placeholder="Contraseña" required class="block mb-4 w-full px-4 py-2 border border-gray-300 rounded-lg" />
                    <select id="newRole" class="block mb-4 w-full px-4 py-2 border border-gray-300 rounded-lg">
                        <option value="user">Usuario</option>
                        <option value="admin">Staff</option>
                    </select>
                    <button class="w-full bg-blue-600 text-white py-2 rounded-lg">Agregar</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://zftsryepbhwbaegedfcj.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmdHNyeWVwYmh3YmFlZ2VkZmNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ4Mjc0NTEsImV4cCI6MjA2MDQwMzQ1MX0.c0-E4SdXv7g3WWLERMQfz4VUmxP_rMTQUDt3UG8GY_w";
        const headers = {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
        };

        function showTab(id) {
            document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
            document.getElementById(id).classList.add("active");
        }

        async function login(e) {
            e.preventDefault();
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            const res = await fetch(`${SUPABASE_URL}/rest/v1/users?username=eq.${user}&password=eq.${pass}`, {
                method: "GET",
                headers
            });
            const data = await res.json();

            if (data.length > 0) {
                localStorage.setItem("currentUser", JSON.stringify(data[0]));
                document.getElementById("loginForm").classList.add("hidden");
                document.getElementById("panel").classList.remove("hidden");
                loadUserData(data[0]);
            } else {
                alert("Credenciales incorrectas");
            }
        }

        async function loadUserData(user) {
            document.getElementById("userName").textContent = user.name;
            document.getElementById("userRole").textContent = user.role;
            document.getElementById("panelTitle").textContent = user.role === "admin" ? "Panel Staff" : "Panel Usuario";

            if (user.role === "admin") {
                document.getElementById("addUserBtn").classList.remove("hidden");
            }

            const incidenciasRes = await fetch(`${SUPABASE_URL}/rest/v1/incidencias?user_id=eq.${user.id}`, { headers });
            const incidencias = await incidenciasRes.json();
            document.getElementById("incidenciasList").innerHTML = incidencias.map(i => `<li>${i.motivo} - ${i.fecha}: ${i.descripcion}</li>`).join('');

            const multasRes = await fetch(`${SUPABASE_URL}/rest/v1/multas?user_id=eq.${user.id}`, { headers });
            const multas = await multasRes.json();
            document.getElementById("multasList").innerHTML = multas.map(m => `<li>${m.motivo} - $${m.cantidad} (${m.estado})</li>`).join('');
        }

        async function addUser(e) {
            e.preventDefault();
            const newUser = {
                username: document.getElementById("newUsername").value,
                password: document.getElementById("newPassword").value,
                role: document.getElementById("newRole").value,
                name: document.getElementById("newUsername").value
            };
            const res = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
                method: "POST",
                headers,
                body: JSON.stringify(newUser)
            });
            if (res.ok) alert("Usuario agregado correctamente");
        }
    </script>
</body>
</html>
