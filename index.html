<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Usuario - Roblox</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@2.8.2" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <style>
        .hidden {
            display: none;
        }

        .tab {
            display: none;
        }

            .tab.active {
                display: block;
            }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Navbar (fixed) -->
    <div class="bg-blue-600 text-white p-4 flex justify-between items-center fixed w-full top-0 z-10">
        <h1 class="text-xl font-semibold">Panel de Usuario</h1>
        <div>
            <button onclick="logout()" class="bg-red-600 px-4 py-2 rounded-lg text-sm">Cerrar sesión</button>
        </div>
    </div>

    <!-- Sidebar (left) -->
    <div class="flex h-screen">
        <div class="bg-blue-800 w-64 p-6 text-white flex flex-col">
            <h2 class="text-2xl font-semibold mb-6">Menú de Usuario</h2>
            <nav class="flex flex-col gap-4">
                <button onclick="showTab('perfilTab')" class="hover:bg-blue-700 py-2 px-4 rounded-lg">Mi Perfil</button>
                <button onclick="showTab('incidenciasTab')" class="hover:bg-blue-700 py-2 px-4 rounded-lg">Mis Incidencias</button>
                <button onclick="showTab('multasTab')" class="hover:bg-blue-700 py-2 px-4 rounded-lg">Mis Multas</button>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-6 ml-64">

            <!-- Pestañas de contenido -->
            <div id="perfilTab" class="tab active">
                <h2 class="text-2xl font-semibold mb-4">Mi Perfil</h2>
                <div class="bg-white shadow-lg rounded-lg p-6">
                    <div class="mb-4">
                        <h3 class="text-lg font-medium">Nombre: <span id="userName">John Doe</span></h3>
                        <h3 class="text-lg font-medium">Rol: <span id="userRole">Jugador</span></h3>
                    </div>
                </div>
            </div>

            <div id="incidenciasTab" class="tab">
                <h2 class="text-2xl font-semibold mb-4">Mis Incidencias</h2>
                <div class="bg-white shadow-lg rounded-lg p-6">
                    <ul id="incidenciasList">
                        <!-- Incidencias del usuario se cargarán aquí -->
                    </ul>
                </div>
            </div>

            <div id="multasTab" class="tab">
                <h2 class="text-2xl font-semibold mb-4">Mis Multas</h2>
                <div class="bg-white shadow-lg rounded-lg p-6">
                    <ul id="multasList">
                        <!-- Multas del usuario se cargarán aquí -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Suponemos que estos datos provienen de una base de datos o almacenamiento local
        const currentUser = {
            name: "John Doe",
            role: "Jugador",
            incidencias: [
                { motivo: "Falta de comportamiento", fecha: "2025-04-16" },
                { motivo: "Spam en chat", fecha: "2025-04-15" }
            ],
            multas: [
                { motivo: "Infracción de tráfico", cantidad: "100€", estado: "Pendiente" }
            ]
        };

        function showTab(tab) {
            document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
            document.getElementById(tab).classList.add("active");
        }

        function loadUserData() {
            // Cargar datos del usuario en el perfil
            document.getElementById("userName").textContent = currentUser.name;
            document.getElementById("userRole").textContent = currentUser.role;

            // Cargar las incidencias
            const incList = document.getElementById("incidenciasList");
            currentUser.incidencias.forEach(inc => {
                const li = document.createElement("li");
                li.textContent = `${inc.motivo} - ${inc.fecha}`;
                incList.appendChild(li);
            });

            // Cargar las multas
            const multaList = document.getElementById("multasList");
            currentUser.multas.forEach(multa => {
                const li = document.createElement("li");
                li.textContent = `${multa.motivo} - ${multa.cantidad} - Estado: ${multa.estado}`;
                multaList.appendChild(li);
            });
        }

        // Llamamos a la función para cargar los datos cuando la página cargue
        window.onload = function () {
            loadUserData();
        }

        function logout() {
            // Aquí podrías hacer logout real (limpiar sesión o redirigir a otra página)
            alert("Has cerrado sesión");
        }
    </script>
</body>
</html>
