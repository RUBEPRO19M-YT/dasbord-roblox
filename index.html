<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Panel de Usuario/Staff</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@2.8.2" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <style>
        .hidden {
            display: none;
        }

        .tab {
            display: none;
        }

            .tab.active {
                display: block;
            }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Login Form -->
    <div id="loginForm" class="flex justify-center items-center h-screen">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h2 class="text-2xl font-semibold mb-4">Iniciar sesión</h2>
            <form id="login" onsubmit="return login(event)">
                <div class="mb-4">
                    <label for="username" class="block text-gray-700">Nombre de usuario</label>
                    <input type="text" id="username" name="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-gray-700">Contraseña</label>
                    <input type="password" id="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg">Iniciar sesión</button>
            </form>
        </div>
    </div>

    <!-- Panel (desaparece hasta hacer login) -->
    <div id="panel" class="hidden flex h-screen">
        <!-- Sidebar (left) -->
        <div class="bg-blue-800 w-64 p-6 text-white flex flex-col">
            <h2 class="text-2xl font-semibold mb-6" id="panelTitle">Menú de Usuario</h2>
            <nav class="flex flex-col gap-4">
                <button onclick="showTab('perfilTab')" class="hover:bg-blue-700 py-2 px-4 rounded-lg">Mi Perfil</button>
                <button onclick="showTab('incidenciasTab')" class="hover:bg-blue-700 py-2 px-4 rounded-lg">Mis Incidencias</button>
                <button onclick="showTab('multasTab')" class="hover:bg-blue-700 py-2 px-4 rounded-lg">Mis Multas</button>
                <button id="addUserBtn" class="hover:bg-blue-700 py-2 px-4 rounded-lg hidden" onclick="showAddUserForm()">Agregar Usuario</button>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-6 ml-64">
            <div id="perfilTab" class="tab active">
                <h2 class="text-2xl font-semibold mb-4">Mi Perfil</h2>
                <div class="bg-white shadow-lg rounded-lg p-6">
                    <h3 class="text-lg font-medium">Nombre: <span id="userName">Juan Doe</span></h3>
                    <h3 class="text-lg font-medium">Rol: <span id="userRole">Usuario</span></h3>
                </div>
            </div>

            <div id="incidenciasTab" class="tab">
                <h2 class="text-2xl font-semibold mb-4">Mis Incidencias</h2>
                <div class="bg-white shadow-lg rounded-lg p-6">
                    <ul id="incidenciasList">
                        <!-- Incidencias del usuario se cargarán aquí -->
                    </ul>
                    <button onclick="addIncidencia()" class="mt-4 bg-green-500 text-white py-2 px-4 rounded-lg">Agregar Incidencia</button>
                </div>
            </div>

            <div id="multasTab" class="tab">
                <h2 class="text-2xl font-semibold mb-4">Mis Multas</h2>
                <div class="bg-white shadow-lg rounded-lg p-6">
                    <ul id="multasList">
                        <!-- Multas del usuario se cargarán aquí -->
                    </ul>
                    <button onclick="addMulta()" class="mt-4 bg-red-500 text-white py-2 px-4 rounded-lg">Agregar Multa</button>
                </div>
            </div>

            <div id="addUserForm" class="tab hidden">
                <h2 class="text-2xl font-semibold mb-4">Agregar Nuevo Usuario</h2>
                <form id="addUser" onsubmit="return addUser(event)">
                    <div class="mb-4">
                        <label for="newUsername" class="block text-gray-700">Nombre de Usuario</label>
                        <input type="text" id="newUsername" name="newUsername" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
                    </div>
                    <div class="mb-4">
                        <label for="newPassword" class="block text-gray-700">Contraseña</label>
                        <input type="password" id="newPassword" name="newPassword" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
                    </div>
                    <div class="mb-4">
                        <label for="newRole" class="block text-gray-700">Rol</label>
                        <select id="newRole" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                            <option value="user">Usuario</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg">Agregar Usuario</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Datos de ejemplo para simular autenticación
        const users = {
            "user1": { password: "1234", role: "user", name: "Juan", incidencias: [], multas: [] },
            "admin1": { password: "admin", role: "admin", name: "Admin", incidencias: [], multas: [] }
        };

        function showTab(tab) {
            document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
            document.getElementById(tab).classList.add("active");
        }

        function login(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (users[username] && users[username].password === password) {
                // Guardamos al usuario en localStorage
                localStorage.setItem("currentUser", JSON.stringify(users[username]));

                // Redirigir al panel correspondiente
                loadUserData(users[username]);

                // Ocultar el formulario de login y mostrar el panel
                document.getElementById("loginForm").classList.add("hidden");
                document.getElementById("panel").classList.remove("hidden");
            } else {
                alert("Credenciales incorrectas");
            }
        }

        function loadUserData(user) {
            // Mostrar nombre y rol
            document.getElementById("userName").textContent = user.name;
            document.getElementById("userRole").textContent = user.role;
            document.getElementById("panelTitle").textContent = user.role === "admin" ? "Panel de Administración" : "Menú de Usuario";

            // Cargar incidencias y multas
            const incList = document.getElementById("incidenciasList");
            user.incidencias.forEach(inc => {
                const li = document.createElement("li");
                li.textContent = `${inc.motivo} - ${inc.fecha}`;
                incList.appendChild(li);
            });

            const multaList = document.getElementById("multasList");
            user.multas.forEach(multa => {
                const li = document.createElement("li");
                li.textContent = `${multa.motivo} - ${multa.cantidad} - Estado: ${multa.estado}`;
                multaList.appendChild(li);
            });

            // Si es admin, habilitar opción de agregar usuario
            if (user.role === "admin") {
                document.getElementById("addUserBtn").classList.remove("hidden");
            }
        }

        function logout() {
            localStorage.removeItem("currentUser");
            document.getElementById("loginForm").classList.remove("hidden");
            document.getElementById("panel").classList.add("hidden");
        }

        function addIncidencia() {
            const incidencia = { motivo: "Comportamiento inapropiado", fecha: new Date().toLocaleDateString() };
            const currentUser = JSON.parse(localStorage.getItem("currentUser"));
            currentUser.incidencias.push(incidencia);
            localStorage.setItem("currentUser", JSON.stringify(currentUser));
            loadUserData(currentUser);
        }

        function addMulta() {
            const multa = { motivo: "Infracción de tráfico", cantidad: 50, estado: "Pendiente" };
            const currentUser = JSON.parse(localStorage.getItem("currentUser"));
            currentUser.multas.push(multa);
            localStorage.setItem("currentUser", JSON.stringify(currentUser));
            loadUserData(currentUser);
        }

        function showAddUserForm() {
            showTab('addUserForm');
        }

        function addUser(event) {
            event.preventDefault();
            const newUsername = document.getElementById("newUsername").value;
            const newPassword = document.getElementById("newPassword").value;
            const newRole = document.getElementById("newRole").value;
            users[newUsername] = { password: newPassword, role: newRole, name: newUsername, incidencias: [], multas: [] };
            alert(`Usuario ${newUsername} agregado exitosamente`);
            showTab('perfilTab');
        }

        // Comprobar si ya hay un usuario logueado
        window.onload = function () {
            const currentUser = JSON.parse(localStorage.getItem("currentUser"));
            if (currentUser) {
                loadUserData(currentUser);
                document.getElementById("loginForm").classList.add("hidden");
                document.getElementById("panel").classList.remove("hidden");
            }
        }
    </script>

</body>
</html>
